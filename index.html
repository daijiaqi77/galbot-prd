<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河开发者平台 - PRD文档</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tree-node { cursor: pointer; transition: all 0.2s; }
        .tree-node:hover { background: #eff6ff; }
        .tree-node.active { background: #dbeafe; border-left: 3px solid #3b82f6; }
        .prose h3 { margin-top: 1.5rem; margin-bottom: 0.75rem; font-size: 1.125rem; font-weight: 600; }
        .prose h4 { margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1rem; font-weight: 600; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .prose th, .prose td { border: 1px solid #e5e7eb; padding: 0.5rem; text-align: left; }
        .prose th { background: #f9fafb; font-weight: 600; }
        .mode-tab { padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .mode-tab.active { background: #3b82f6; color: white; }
        .mode-tab:not(.active) { background: #f3f4f6; color: #6b7280; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="app" class="h-full flex flex-col">
        <header class="bg-white border-b border-gray-200 px-6 py-3 flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold text-gray-900">
                        <i class="fas fa-file-alt text-blue-500 mr-2"></i>
                        银河开发者平台 PRD文档
                    </h1>
                    <span class="text-sm text-gray-500">v2.3</span>
                </div>
                <div class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded">
                    <i class="fas fa-eye mr-1"></i> 只读查看模式
                </div>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
                <div class="p-4 border-b border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-700 flex items-center">
                        <i class="fas fa-sitemap text-blue-500 mr-2"></i> PRD结构
                    </h3>
                </div>
                <div id="hierarchyTree" class="flex-1 overflow-y-auto p-3"></div>
            </aside>

            <main class="flex-1 flex flex-col overflow-hidden">
                <div id="breadcrumb" class="bg-white border-b border-gray-200 px-6 py-2 text-sm flex items-center"></div>
                <div id="contentArea" class="flex-1 overflow-y-auto bg-gray-50"></div>
            </main>
        </div>
    </div>

    <script>
        // 数据（与编辑器相同，但这里展示只读版本）
        let appState = {
            currentView: 'interface',
            currentNode: null,
            currentFeature: null,
            currentMode: 'phone',
            data: {
                name: '银河开发者平台',
                version: 'v2.3',
                interfaces: {
                    'login': {
                        id: 'login',
                        name: '登录注册',
                        status: '开发中',
                        prd: {
                            overview: '登录注册是用户进入平台的入口界面，为用户提供多种登录方式选择。',
                            userStory: '作为**开发者**，我希望能够快速登录平台，以便立即开始我的开发工作。',
                            requirements: [
                                '提供清晰的登录入口',
                                '支持多种登录方式',
                                '记住用户登录状态',
                                '提供登录失败的安全保护'
                            ],
                            layout: '\n1. 顶部：平台Logo和标语\n2. 左侧：产品介绍区域\n3. 右侧：登录表单区域\n   - 手机号输入框\n   - 验证码输入框\n   - 登录按钮\n   - 其他登录方式（微信）\n',
                            edgeCases: [
                                '网络异常：显示重试按钮',
                                '多次失败：临时锁定账号',
                                '长时间未操作：自动退出'
                            ]
                        },
                        features: {
                            'auth': {
                                id: 'auth',
                                name: '登录功能',
                                prd: {
                                    overview: '实现用户身份验证，支持手机号和微信两种登录模式。',
                                    requirements: [
                                        '手机号登录：验证码方式',
                                        '微信登录：扫码授权',
                                        '登录状态保持30天',
                                        '登录失败限制：5次/小时'
                                    ],
                                    modes: ['手机号登录', '微信登录']
                                },
                                prototype: {
                                    'phone': {
                                        name: '手机号登录模式',
                                        description: '\n### 手机号登录\n\n**输入规则**：\n- 手机号：11位数字，1开头，第二位3-9\n- 验证码：6位数字，有效期5分钟\n\n**交互流程**：\n1. 用户输入手机号\n2. 点击"获取验证码"\n3. 系统发送验证码，按钮显示60秒倒计时\n4. 用户输入验证码\n5. 点击"登录"按钮\n6. 验证通过，进入首页\n'
                                    },
                                    'wechat': {
                                        name: '微信登录模式',
                                        description: '\n### 微信登录\n\n**交互流程**：\n1. 用户点击"微信登录"按钮\n2. 弹出二维码弹窗\n3. 用户使用微信扫码\n4. 微信授权确认\n5. 自动登录成功\n'
                                    }
                                }
                            }
                        }
                    }
                }
            }
        };

        function init() {
            renderTree();
            showInterface('login');
        }

        function renderTree() {
            const treeEl = document.getElementById('hierarchyTree');
            let html = '';
            Object.entries(appState.data.interfaces).forEach(([intId, int]) => {
                html += `<div class="mb-2">
                    <div class="tree-node p-2 rounded ${appState.currentNode === intId ? 'active' : ''}"
                         onclick="showInterface('${intId}')">
                        <i class="fas fa-window-maximize text-blue-500 mr-2"></i>
                        <span class="font-medium">${int.name}</span>
                    </div>`;
                Object.entries(int.features).forEach(([featId, feat]) => {
                    html += `<div class="ml-4 mt-1">
                        <div class="tree-node p-2 rounded text-sm ${appState.currentFeature === featId ? 'active' : ''}"
                             onclick="showFeature('${intId}', '${featId}')">
                            <i class="fas fa-cog text-purple-500 mr-2"></i>
                            ${feat.name}
                        </div>
                    </div>`;
                });
                html += `</div>`;
            });
            treeEl.innerHTML = html;
        }

        function showInterface(interfaceId) {
            appState.currentView = 'interface';
            appState.currentNode = interfaceId;
            appState.currentFeature = null;
            
            const int = appState.data.interfaces[interfaceId];
            
            document.getElementById('contentArea').innerHTML = `
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-4">${int.name}</h2>
                    <div class="prose prose-sm">
                        <h3>功能概述</h3>
                        <p>${int.prd.overview}</p>
                        <h3>用户故事</h3>
                        <p>${int.prd.userStory}</p>
                        <h3>核心需求</h3>
                        <ul>${int.prd.requirements.map(r => `<li>${r}</li>`).join('')}</ul>
                        <h3>页面布局</h3>
                        <pre><code>${int.prd.layout}</code></pre>
                    </div>
                </div>
            `;
            
            renderTree();
            updateBreadcrumb();
        }

        function showFeature(interfaceId, featureId) {
            appState.currentView = 'feature';
            appState.currentNode = interfaceId;
            appState.currentFeature = featureId;
            
            const int = appState.data.interfaces[interfaceId];
            const feat = int.features[featureId];
            
            document.getElementById('contentArea').innerHTML = `
                <div class="p-6">
                    <span class="text-sm text-gray-500">${int.name} > </span>
                    <h2 class="text-xl font-bold mt-1 mb-4">${feat.name}</h2>
                    <div class="prose prose-sm">
                        <h3>功能概述</h3>
                        <p>${feat.prd.overview}</p>
                        <h3>功能需求</h3>
                        <ul>${feat.prd.requirements.map(r => `<li>${r}</li>`).join('')}</ul>
                        <h3>功能模式</h3>
                        <div class="grid grid-cols-2 gap-4">
                            ${Object.entries(feat.prototype).map(([modeId, mode]) => `
                                <div class="border border-gray-200 rounded p-4">
                                    <h4 class="font-semibold mb-2">${mode.name}</h4>
                                    <div class="prose prose-xs">${marked.parse(mode.description)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            renderTree();
            updateBreadcrumb();
        }

        function updateBreadcrumb() {
            const breadcrumbEl = document.getElementById('breadcrumb');
            let html = `<span><i class="fas fa-home mr-1"></i>银河开发者平台</span>`;
            if (appState.currentNode) {
                const int = appState.data.interfaces[appState.currentNode];
                html += `<span class="mx-2 text-gray-400">/</span><span>${int.name}</span>`;
                if (appState.currentFeature) {
                    const feat = int.features[appState.currentFeature];
                    html += `<span class="mx-2 text-gray-400">/</span><span class="font-semibold">${feat.name}</span>`;
                }
            }
            breadcrumbEl.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
